[project]
name = "sam-football-backend"
version = "0.1.0"
description = "FastAPI controller and SAM 2.1 worker for football analytics"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "numpy>=2.0",
  "opencv-python-headless>=4.11",
  "pydantic-settings>=2.10",
  "PyJWT[crypto]>=2.10",
  "python-multipart>=0.0.20",
  "scipy>=1.16",
  "supabase>=2.18",
  "uvicorn[standard]>=0.35",
  "websockets>=15.0",
]

[project.optional-dependencies]
inference = [
  "easyocr>=1.7",
  "scikit-learn>=1.7",
  "scipy>=1.16",
]
live = [
  "ultralytics==8.4.138",
  "lap>=0.5.12",
]
test = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker", "live"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
